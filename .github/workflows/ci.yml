name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: pip-audit --ignore-vuln PYSEC-2026-2193 --ignore-vuln PYSEC-2026-2562
      # Use shell: bash so semicolons work consistently on Windows
      - run: pip-licenses --from=metadata --order=license --fail-on=GPL;LGPL;AGPL
        shell: bash
      - run: pip install -e ".[langgraph,otel]"
      # mypy needs explicit path argument to know which package to check
      - run: mypy --strict ai_loopguard/ tests/
      - run: pytest --cov=ai_loopguard --cov-fail-under=90
  isolation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Install from local source, NOT from PyPI — we're testing this build
      - run: pip install .
      - run: python -c "import ai_loopguard; print('core import OK')"
      - run: python -c "import langgraph" && exit 1 || echo "langgraph not in core — OK"
      - run: python -c "import crewai" && exit 1 || echo "crewai not in core — OK"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - run: pip-audit
      - run: bandit -c pyproject.toml -r ai_loopguard/ -ll

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$(pwd):/repo" ghcr.io/trufflesecurity/trufflehog:latest git file:///repo --results=verified --no-fail || true
