name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,all]"
      - run: ruff check
      # mypy needs explicit path argument to know which package to check
      - run: mypy --strict ai_loopguard/ tests/
      - run: pytest --cov=ai_loopguard --cov-fail-under=90
      - run: pip-audit
      # Use shell: bash so semicolons work consistently on Windows
      - run: pip-licenses --from=metadata --order=license --fail-on=GPL;LGPL;AGPL
        shell: bash
  isolation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install from local source, NOT from PyPI — we're testing this build
      - run: pip install .
      - run: python -c "import ai_loopguard; print('core import OK')"
      - run: python -c "import langgraph" && exit 1 || echo "langgraph not in core — OK"
      - run: python -c "import crewai" && exit 1 || echo "crewai not in core — OK"
